<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDH Auth Demo — Inicio de Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl shadow-emerald-950/20">
        <!-- Logo / Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 text-white shadow-lg shadow-emerald-500/30 mb-4 text-2xl font-bold">
                <i class="fas fa-shield-halved"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-white">GDH Auth Demo</h1>
            <p class="text-xs text-slate-400 mt-1">Servidor: <span class="text-emerald-400 font-mono font-bold">{{ server_host }}</span> | Contenedor: <span class="text-teal-400 font-mono">{{ container_name }}</span></p>
        </div>

        <div id="login-feedback"></div>

        <!-- Formulario con HTMX -->
        <form hx-post="/login" hx-target="#login-feedback" hx-swap="innerHTML" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Usuario</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                        <i class="fas fa-user text-sm"></i>
                    </span>
                    <input type="text" name="username" value="admin" required
                           class="w-full pl-10 pr-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                        <i class="fas fa-lock text-sm"></i>
                    </span>
                    <input type="password" name="password" value="Digital@2025" required
                           class="w-full pl-10 pr-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit"
                        class="w-full py-3.5 px-4 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-900/40 transition-all flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fas fa-arrow-right-to-bracket"></i>
                    <span>Iniciar Sesión en Producción</span>
                </button>
            </div>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-800 text-center text-xs text-slate-500">
            <p>Conectado a <strong class="text-slate-400">NEXO GD</strong> para monitoreo y AutoFix.</p>
        </div>
    </div>
</body>
</html>

      - ENVIRONMENT=production
      - SERVER_HOST=greenserver
      - CONTAINER_NAME=gdh-auth-demo-prod
      - NEXO_URL=http://100.127.143.52:8000
      - NEXO_API_KEY=demo_key
      - SYSTEM_SLUG=gdh-auth-demo
